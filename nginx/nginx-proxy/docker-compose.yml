services:
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # ✅ Monta o arquivo da mesma pasta
    networks:
      - web-network
    restart: unless-stopped

networks:
  web-network:
    driver: bridge
    name: web-network