services:
  web:
    image: nginx:alpine
    container_name: projeto1
    volumes:
      - ./html:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"                                          # Habilita o Traefik
      - "traefik.http.routers.projeto1.rule=Host(`projeto1.empresa`)" # Regra de roteamento
      - "traefik.http.services.projeto1.loadbalancer.server.port=80"  # Porta interna
    networks:
      - web-network

networks:
  web-network:
    external: true  # Usa a rede já criada pelo Traefik