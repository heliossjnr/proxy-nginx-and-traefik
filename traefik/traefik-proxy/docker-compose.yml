services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"    # Dashboard do Traefik (opcional)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Para descobrir containers
      - ./traefik.yml:/etc/traefik/traefik.yml:ro     # Configuração
    networks:
      - web-network
    restart: unless-stopped

networks:
  web-network:
    driver: bridge
    name: web-network